<div class="weekly-goals-item-container">
  <div class="item">
    <mat-checkbox class="box" [checked]="completed()" (change)="toggleGoal()"></mat-checkbox>
    <div class="goal-wrapper">
      <div class="goal" [class.completed]="completed()">{{ text() }}</div>
      <div class="hashtag" [class.completed]="completed()" [style.color]="hashtagColor()">{{ hashtag() }} </div>
    </div>
  </div>
</div>
