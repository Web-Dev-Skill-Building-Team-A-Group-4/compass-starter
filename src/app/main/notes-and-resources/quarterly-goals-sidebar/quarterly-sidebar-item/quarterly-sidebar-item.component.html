<div class="quarterly-sidebar-item-container">
  <mat-divider></mat-divider>
  <div class="list-item">
    <mat-checkbox class="checkbox" 
      [aria-label]="goal().text"
      [checked]="goal().completed"
      (change)="checkGoal(goal())"/>
    <p class="goal" [class.completed]="goal().completed">{{ goal().text }}</p>
  </div>
</div>
